[project]
name = "kore"
version = "0.1.0"
description = "Kore — personal companion (Telegram + OpenRouter). Speaks as Jone."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "openai>=1.54",
    "httpx>=0.27",
    "mcp>=1.28.1",
    "aiosqlite>=0.22.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
