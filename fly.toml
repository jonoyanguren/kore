# fly.toml app configuration file generated for jornvis on 2026-07-26T00:47:49+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'jornvis'
primary_region = 'fra'

[env]
  STORAGE_DB_PATH = "/data/jornvis.db"

[build]

[mounts]
  source = "jornvis_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
