# fly.toml — Kore (companion speaks as Jone)
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kore'
primary_region = 'fra'

[env]
  STORAGE_DB_PATH = "/data/kore.db"
  ASSISTANT_NAME = "Jone"
  OPENROUTER_MODEL = "xiaomi/mimo-v2.5"

[build]

[mounts]
  source = "kore_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
