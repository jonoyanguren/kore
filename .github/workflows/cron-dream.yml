# Optional manual trigger for dream (in-process cron is the primary schedule).
# workflow_dispatch only — no GitHub schedule (delays of hours).
name: cron-dream

on:
  workflow_dispatch:

jobs:
  dream:
    runs-on: ubuntu-latest
    steps:
      - name: POST /internal/cron/dream
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          KORE_CRON_URL: ${{ vars.KORE_CRON_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing repo secret CRON_SECRET" >&2
            exit 1
          fi
          URL="${KORE_CRON_URL:-https://kore.fly.dev/internal/cron/dream}"
          code="$(curl -sS -o /tmp/dream.json -w '%{http_code}' -X POST "$URL" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")"
          echo "HTTP $code"
          cat /tmp/dream.json
          echo
          test "$code" = "200"
